  <!-- APLICAR TEMA ANTES DE QUE REACT SE MONTE - EVITA PARPADEO -->
  <script>
    (function () {
      try {
        if (typeof document === 'undefined' || !document.documentElement) {
          return;
        }

        const savedConfig = localStorage.getItem('zn-portal-user-theme');
        let theme = 'light';

        if (savedConfig) {
          try {
            const parsed = JSON.parse(savedConfig);
            if (parsed.autoDetect !== false) {
              const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              theme = prefersDark ? 'dark' : 'light';
            } else {
              theme = parsed.theme || 'light';
            }
          } catch (e) {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
        } else {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = prefersDark ? 'dark' : 'light';
        }

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-accessibility', 'default');

        if (theme === 'dark') {
          document.documentElement.style.backgroundColor = '#0d1510';
        } else {
          document.documentElement.style.backgroundColor = '#fdfbf7';
        }

        if (document.body) {
          document.body.className = 'theme-' + theme + ' accessibility-default';
          if (theme === 'dark') {
            document.body.style.backgroundColor = '#0d1510';
          } else {
            document.body.style.backgroundColor = '#fdfbf7';
          }
        } else {
          const applyToBody = function () {
            if (document.body) {
              document.body.className = 'theme-' + theme + ' accessibility-default';
              if (theme === 'dark') {
                document.body.style.backgroundColor = '#0d1510';
              } else {
                document.body.style.backgroundColor = '#fdfbf7';
              }
            } else {
              setTimeout(applyToBody, 0);
            }
          };
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyToBody);
          } else {
            applyToBody();
          }
        }
      } catch (e) {
        if (document.documentElement) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = '#fdfbf7';
        }
        if (document.body) {
          document.body.className = 'theme-light accessibility-default';
          document.body.style.backgroundColor = '#fdfbf7';
        }
      }
    })();
  </script>
